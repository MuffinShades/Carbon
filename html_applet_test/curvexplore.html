<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%; overflow: hidden; position: absolute;">
    <head>
        <title> </title>
    </head>
    <body>
        <div id='inp'>
            <textarea placeholder='input json here' id='h'></textarea>
        </div>
        <div style="display:none;" id="controls">
            <button id='zin'>Zoom In</button>
            <button id='zout'>Zoom Out</button>
        </div><br>
        <script>
            var testDat = `
            {
            "inf": {
                "dim": {
                    "tl": [-500.0, -500.0],
                    "tr": [500.0, -500.0],
                    "bl": [-500.0, 500.0],
                    "br": [500.0, 500.0]
                },
                "showGrid": 0,
                "maintainDerivatives": 1
            },
            "dat": [
                {
                    "p":[[0.0,0.0],[100.0,-100.0],[200.0,0.0]],
                    "c": [[2,2],[-1,0],[1,0]]
                },
                {
                    "p":[[200.0,0.0],[150.0,100.0],[100.0,200.0]],
                    "c": [[0,2],[-1,0],[2,0]]
                },
                {
                    "p":[[100.0,200.0],[50.0,100.0],[0.0,0.0]],
                    "c": [[1,2],[-1,0],[0,0]]
                }
            ]
            }
            `;

const pointR = 3;
const clickGrace = 2;
            
var curve = function(p0, p1, p2) {
    this.p = [p0,p1,p2];
    this.colorComponent = {
        r: Math.random() * 255,
        g: Math.random() * 255,
        b: Math.random() * 255
    };
    this.color = `rgb(${this.colorComponent.r}, ${this.colorComponent.g}, ${this.colorComponent.b})`;
    this.darkColor = `rgb(${this.colorComponent.r * 0.75}, ${this.colorComponent.g * 0.75}, ${this.colorComponent.b * 0.75})`;
    this.draw = function(ctx, translate) {
        const lw = 2;


        var rl = function(c, l, self) {
            ctx.lineWidth = l;
            ctx.strokeStyle = c;
            ctx.beginPath();
            ctx.moveTo(self.p[0].x * translate.xs + translate.x, self.p[0].y * translate.ys + translate.y);

            const t_res = 1.0 / 30;

            var bx, by;

            for (var t = 0.0; t <= 1.0; t += t_res) {
                bx = self.p[0].x * (1.0 - t) * (1.0 - t) + self.p[1].x * (1.0 - t) * t * 2.0 + self.p[2].x * t * t;
                by = self.p[0].y * (1.0 - t) * (1.0 - t) + self.p[1].y * (1.0 - t) * t * 2.0 + self.p[2].y * t * t;

                ctx.lineTo(bx * translate.xs + translate.x, by * translate.ys + translate.y);
            }

            ctx.lineTo(self.p[2].x * translate.xs + translate.x, self.p[2].y * translate.ys + translate.y);

            ctx.stroke();
        };

        rl(this.color, lw, this);

        for (var i = 0; i < this.p.length; i++) {
            ctx.fillStyle = this.darkColor;

            ctx.beginPath();
            ctx.arc(this.p[i].x * translate.xs + translate.x, this.p[i].y * translate.ys + translate.y, pointR, 0, 2 * Math.PI, false);
            ctx.fill();

            ctx.fillStyle = this.color;

            ctx.beginPath();
            ctx.arc(this.p[i].x * translate.xs + translate.x, this.p[i].y * translate.ys + translate.y, pointR-1, 0, 2 * Math.PI, false);
            ctx.fill();
        }
    }
}

var run = (function(edat) {
    const dat = JSON.parse(edat);

    if (!dat) {
        console.error('failed to parse dat');
        return;
    }

    const pdat = dat.dat;

    if (!pdat) {
        console.error('failed to find pdat');
        return;
    }

    const can = document.createElement('canvas');

    if (!can) {
        console.error('failed to create canvas');
        return;
    }

    const ctx = can.getContext('2d');

    ctx.translate(0.5,0.5);

    document.getElementById('inp').style.display = 'none';
    document.body.appendChild(can);
    document.body.style = 'background-image:linear-gradient(#f9f9f9,#fff); width: 100%; height: 100%; position: absolute; top: 0; left: 0;';

    can.width = 500;
    can.height = 500;

    can.style = 'border: 1px solid #999; border-radius: 3px;';

    ///
    var iinf = dat.inf, ddim = null;
    if (iinf) ddim = iinf.dim;

    var ctrans = {
        x: 0,
        xs: 1.0,
        y: 0,
        ys: 1.0
    };

    var zoomBox = ddim;

    function computeTranslations(ddim) {
        const ww = ddim.tr[0] - ddim.tl[0], hh = ddim.bl[1] - ddim.tl[1];

        ctrans.xs = can.width / ww;
        ctrans.ys = can.height / hh;

        ctrans.x = -ddim.tl[0] * ctrans.xs;
        ctrans.y = -ddim.tl[1] * ctrans.ys;
    }

    if (zoomBox) {
        computeTranslations(zoomBox);
    }

    var mDeriv = false;

    if (iinf.maintainDerivatives) {
        mDeriv = iinf.maintainDerivatives;
    }

    console.log(ddim, ctrans);
    console.log(mDeriv);

    const options = dat.inf;

    var mouse = {
        x: 0, y: 0
    };

    var cu = [];

    console.log(pdat, dat);

    var pconvert = function(p, c) {
        return {
            x: p[0],
            y: p[1],
            ci: c[0],
            cp: c[1]
        };
    }

    for (var i = 0; i < pdat.length; i++) {
        if (pdat[i].p)
            cu[i] = new curve(pconvert(pdat[i].p[0], pdat[i].c[0]), pconvert(pdat[i].p[1], pdat[i].c[1]), pconvert(pdat[i].p[2], pdat[i].c[2]));
        else
            cu[i] = null;
    }

    console.log(cu);

    const render = {
        bg: function() {
            const bgColor = '#f3f3f3';

            ctx.fillStyle = bgColor;
            ctx.fillRect(0,0,can.width,can.height);
        },
        grid: function() {

        },
        curves: function(t) {
            for (c of cu) {
                if (!c) continue;

                c.draw(ctx, t);
            }
        },
        all: function(t) {
            this.bg();

            if (options.showGrid) this.grid();

            ctx.fillStyle = '#f00';
            ctx.fillRect(mouse.x,mouse.y,12,19);

            this.curves(t);
        }
    };

    var movCurve = -1, movPoint = 0, mdx, mdy;

    can.addEventListener('mousemove', function(e) {
        mouse.x = e.pageX - can.getBoundingClientRect().left - 1;
        mouse.y = e.pageY - can.getBoundingClientRect().top - 1;

        //
        render.all(ctrans);

        if (movCurve >= 0) {
            var cMag = function (cc, p0, p1) {
                return Math.sqrt((cc.p[p0].x - cc.p[p1].x) ** 2 + (cc.p[p0].y - cc.p[p1].y) ** 2);
            }

            var pDot = function(p0, p1) {
                return p0.x * p1.x + p0.y * p1.y;
            }

            var pAdd = function(p0, p1) {
                return {
                    x: p0.x + p1.x,
                    y: p0.y + p1.y
                };
            }

            var pSub = function(p0, p1) {
                return {
                    x: p0.x - p1.x,
                    y: p0.y - p1.y
                };
            }

            var pScale = function(p, s) {
                return {
                    x: p.x * s,
                    y: p.y * s
                };
            }

            const epsil_min = 0.0001;
            const m1 = cMag(cu[movCurve], 0, 1), m2 = cMag(cu[movCurve], 0, 2);
            if (m1 < epsil_min) m1 = epsil_min;
            if (m2 < epsil_min) m2 = epsil_min;
            var magR = m1 / m2,
                _dot = pDot(
                    pScale(
                        pSub(cu[movCurve].p[1], cu[movCurve].p[0])
                    , 1.0 / m1), 
                    /*pScale( 
                        pSub(cu[movCurve].p[2], cu[movCurve].p[0])
                    , 1.0 / m2)*/
                    {x:1.0,y:0.0}
                );

            if (_dot > 1.0) _dot = 1.0;
            if (_dot < -1.0) _dot = -1.0;

            var mTheta = Math.acos(_dot);

            console.log(m1, m2, mTheta, _dot, magR);

            const dir = pSub(cu[movCurve].p[2], cu[movCurve].p[0]);

            cu[movCurve].p[movPoint].x = (mouse.x + mdx - ctrans.x)  / ctrans.xs;
            cu[movCurve].p[movPoint].y = (mouse.y + mdy - ctrans.y)  / ctrans.ys;

            if (movPoint != 1 && mDeriv) {
                const M = magR * m2;

                cu[movCurve].p[1].x = cu[movCurve].p[0].x + Math.cos(mTheta) * M * Math.sign(dir.x);
                cu[movCurve].p[1].y = cu[movCurve].p[0].y + Math.sin(mTheta) * M * Math.sign(dir.y);
            }

            const cc = cu[movCurve].p[movPoint];

            console.log(cc);

            if (cc.ci >= 0) {
                cu[cc.ci].p[cc.cp].x = cu[movCurve].p[movPoint].x;
                cu[cc.ci].p[cc.cp].y = cu[movCurve].p[movPoint].y;
            }
        }
    });

    can.addEventListener('mousedown', function(e) {
        mouse.x = e.pageX - can.getBoundingClientRect().left - 1;
        mouse.y = e.pageY - can.getBoundingClientRect().top - 1;

        //
        var j = 0, i;

        movCurve = -1;

        for (c of cu) {
            j++;
            if (!c) continue;

            for (i = 0; i < c.p.length; i++) {
                mdx = c.p[i].x - (mouse.x - ctrans.x)  / ctrans.xs;
                mdy = c.p[i].y - (mouse.y - ctrans.y) / ctrans.ys;

                const adjR = (pointR + clickGrace) / Math.min(ctrans.xs, ctrans.ys);

                if (mdx * mdx + mdy * mdy <= adjR * adjR) {
                    movCurve = j-1;
                    movPoint = i;
                    break;
                }
            }

            if (movCurve >= 0) break;
        }
    });

    can.addEventListener('mouseup', function(e) {
        mouse.x = e.pageX - can.getBoundingClientRect().left - 1;
        mouse.y = e.pageY - can.getBoundingClientRect().top - 1;

        //
        movCurve = -1;
    });

    const zoom = {
        in: function() {
            zoomBox.tl[0] += 50;
            zoomBox.tr[0] -= 50;
            zoomBox.bl[0] += 50;
            zoomBox.br[0] -= 50;

            zoomBox.tl[1] -= 50;
            zoomBox.tr[1] -= 50;
            zoomBox.bl[1] += 50;
            zoomBox.br[1] += 50;

            computeTranslations(zoomBox);
            console.log(ctrans);
            render.all(ctrans);
        },
        out: function() {
            zoomBox.tl[0] -= 50;
            zoomBox.tr[0] += 50;
            zoomBox.bl[0] -= 50;
            zoomBox.br[0] += 50;

            zoomBox.tl[1] += 50;
            zoomBox.tr[1] += 50;
            zoomBox.bl[1] -= 50;
            zoomBox.br[1] -= 50;

            console.log(ctrans);
            computeTranslations(zoomBox);
            render.all(ctrans);
        }
    }

    document.getElementById('zin').addEventListener('click', function(e) {
        zoom.in();
    })

    document.getElementById('zout').addEventListener('click', function(e) {
        zoom.out();
    })

    const ContourCorrect = {
        findCurveFriends: function() {
            
        },
        snapShape: function() {

        }
    };

    render.all(ctrans);

    document.getElementById('controls').style.display = 'block';
});

            //run(testDat);
        </script>
        <button id='g' onclick="(function(){var d = document.getElementById('h').value; run(d); document.getElementById('g').style.display = 'none';})();">go</button>
    </body>
</html>
